name: FB2 page regression
on:
  push:
    branches:
      - fix/fb2-pages-not-chapters-20261024
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reader-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Reader contact recognizer
        run: node scripts/test-reader-gestures.mjs
      - name: Real phone-width FB2 page geometry
        run: node scripts/test-fb2-phone-pages.mjs
      - name: Existing workspace regression
        run: npm test
      - name: Existing cloud sync regression
        run: npm run test:sync
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Test page turns in real browser layouts
        run: node scripts/test-fb2-in-browsers.mjs
      - name: Stage tested GitHub Pages bundle on candidate branch
        run: |
          cp -a dist/. ../
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if ! git diff --cached --quiet; then
            git commit -m "Stage FB2 phone-page reader build"
            git push origin HEAD:refs/heads/fix/fb2-pages-not-chapters-20261024
          fi
