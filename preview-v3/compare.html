<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANTONOVIUM · контроль композиции</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#cfd3d0;color:#14221f;font:14px/1.4 system-ui,sans-serif}
.controls{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid #aaa}
button{border:1px solid #b8c2bb;border-radius:7px;background:#fff;padding:7px 12px;cursor:pointer;font:inherit}button[aria-pressed=true]{background:#202d28;color:#fff}
#label{font-weight:700;margin-right:16px}.stage{margin:18px auto;max-width:100%;overflow:auto;text-align:center}
iframe{display:block;margin:0 auto;background:#fff;border:1px solid #9da59f;box-shadow:0 12px 32px #28322c2b;height:900px;width:1280px}
</style>
<div class="controls"><span id="label">До · 1280 px</span>
<button data-version="before" aria-pressed="true">До</button><button data-version="after" aria-pressed="false">После</button>
<button data-width="1280" aria-pressed="true">1280 px</button><button data-width="768" aria-pressed="false">768 px</button><button data-width="390" aria-pressed="false">390 px</button><button data-width="360" aria-pressed="false">360 px</button></div>
<div class="stage"><iframe title="Сравнение ANTONOVIUM" src="../"></iframe></div>
<script>
let version='before',width=1280;const frame=document.querySelector('iframe'),label=document.querySelector('#label');
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.version)version=b.dataset.version;else width=+b.dataset.width;
document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.version?x.dataset.version===version:+x.dataset.width===width)));
frame.style.width=width+'px';frame.src=version==='before'?'../':'./index.html';label.textContent=(version==='before'?'До':'После')+' · '+width+' px'});
</script></html>
