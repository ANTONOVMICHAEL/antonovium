равовая ответственность",x:81,y:67},{id:"reason",title:"Разумность",subtitle:"Оценка поведения",x:17,y:28},{id:"will",title:"Автономия воли",subtitle:"Частное право",x:81,y:25}],bm=[["goodfaith","badfaith"],["badfaith","abuse"],["badfaith","fault"],["reason","goodfaith"],["will","goodfaith"],["reason","abuse"],["will","fault"]],Zi=[{id:"boundaries",title:"Недобросовестность: границы понятия",subtitle:"Демонстрационный текст ANTONOVIUM",format:"digital",demo:!0,categories:["badfaith","goodfaith","abuse","fault","reason"],sections:[{id:"s1",title:"Постановка исследовательского вопроса",paragraphs:[{id:"p1",text:"Исследование начинается с определения того, какой именно вопрос требует разрешения. Для демонстрации читального зала выбрана проблема разграничения оценочных характеристик поведения. Приведенные далее рассуждения служат материалом для работы с интерфейсом и не воспроизводят позиции конкретного ученого."},{id:"p2",text:"Совпадение слов, которыми описывается поведение участника отношений, еще не позволяет сделать вывод о совпадении правовых оснований его оценки. Сначала необходимо установить, к какому обстоятельству относится каждая характеристика, а затем определить, какую функцию она выполняет в исследовательском рассуждении."},{id:"p3",text:"Рабочий вопрос можно сформулировать следующим образом: по каким признакам исследователь различает недобросовестность, неразумность, вину и злоупотребление правом, не подменяя анализ одного понятия перечислением остальных? Ответ предполагает обращение к проверенным первоисточникам, которые в настоящий демонстрационный материал не включены."},{id:"p4",text:"Полезно отдельно фиксировать содержание источника, собственное толкование прочитанного и возникающую гипотезу. Сохранение связи с исходным фрагментом позволяет позднее вернуться к контексту, проверить точность заметки и отказаться от вывода, если материал его не подтверждает."}]},{id:"s2",title:"Различие исследовательских уровней",paragraphs:[{id:"p5",text:"Описание обстоятельств и их юридическая квалификация решают разные задачи. При чтении исследователь может сначала отметить значимые факты, затем выделить использованные автором понятия и лишь после этого оценить предложенную связь между ними. Такая последовательность помогает увидеть недостающие основания аргумента."},{id:"p6",text:"Рабочая заметка не становится доказанным научным положением в момент ее сохранения. У нее может быть более скромная функция: поставить вопрос, обозначить сомнение, сохранить возможное возражение или наметить направление поиска. Система должна сохранять этот статус вместе с текстом."},{id:"p7",text:"При сопоставлении двух фрагментов имеет значение не внешнее сходство формулировок, а место каждого утверждения в рассуждении. В одном случае автор задает границу понятия, в другом описывает следствие уже проведенной квалификации. Без восстановления этой связи сравнение может оказаться преждевременным."},{id:"p8",text:"Выделенный фрагмент можно связать с исследовательской линией, не превращая источник в приложение к единственной рукописи. Один материал способен участвовать в нескольких будущих исследованиях, причем первоначальный контекст чтения остается доступным независимо от их завершения."}]},{id:"s3",title:"От фрагмента к собственной позиции",paragraphs:[{id:"p9",text:"Переход от прочитанного к собственной позиции требует проверки промежуточных оснований. Исследователь отмечает, какое положение он принимает, с какой частью аргумента согласен лишь условно и какое утверждение считает недостаточно обоснованным. В заметке эти различия желательно сохранить прямо."},{id:"p10",text:"Связь понятий на рабочей карте обозначает направление исследования. Она сама по себе не доказывает наличие нормативной, причинной или логической зависимости. Содержание связи должно уточняться по мере обращения к источникам; в демонстрационном атласе показаны только условные исследовательские переходы."},{id:"p11",text:"Если материал читается в бумажном издании, заметка все равно нуждается в точной привязке. Достаточно вручную указать проверенное название издания и фактическую страницу. Номер страницы нельзя восстанавливать по памяти или подставлять ради внешней завершенности записи."},{id:"p12",text:"Научный архив сохраняет не только итоговую рукопись, но и путь к ней: вопросы, отвергнутые предположения, исходные фрагменты и промежуточные решения. Возвращение к такому материалу позволяет развивать новую исследовательскую линию без повторного сбора уже проверенного контекста."}]}]},{id:"qualification",title:"Квалификация поведения: исследовательская рамка",subtitle:"Демонстрационный текст для сопоставления",format:"digital",demo:!0,categories:["fault","reason","badfaith"],sections:[{id:"q1",title:"Основания сравнения",paragraphs:[{id:"q-p1",text:"Для сопоставления понятий сначала выбирается единое основание. Если одно понятие рассматривается через условия его применения, а другое через последствия, различие может возникнуть вследствие самого способа сравнения. Нужна отдельная проверка сопоставимости исследовательских уровней."},{id:"q-p2",text:"Сходный результат правовой оценки не свидетельствует автоматически о тождестве ее оснований. В рабочей таблице полезно различать обстоятельство, оценочный критерий, источник вывода и предполагаемое последствие. Пока источники не проверены, соответствующие графы остаются исследовательским заданием."},{id:"q-p3",text:"Настоящий фрагмент подготовлен исключительно для проверки режима сопоставления. Он не является цитатой из научной публикации, не содержит ссылки на судебный акт и не может использоваться в рукописи как самостоятельное подтверждение правового положения."}]},{id:"q2",title:"Проверка рабочей гипотезы",paragraphs:[{id:"q-p4",text:"Гипотеза должна допускать пересмотр. При обнаружении материала, который не укладывается в первоначальную схему, исследователь уточняет критерий сравнения или ограничивает сферу вывода. Сохраненная заметка позволяет проследить, какое обстоятельство повлияло на изменение позиции."},{id:"q-p5",text:"Фиксация возражений относится к содержательной работе над исследованием. Связанный фрагмент, вопрос к нему и предварительный ответ могут храниться рядом, сохраняя различие между текстом источника и самостоятельным рассуждением."}]}]}],qy=[{id:"r1",title:"Границы недобросовестности",question:"Какие основания сравнения позволяют разграничить смежные характеристики поведения?",hypothesis:"Разделить условия оценки, функцию понятия и предполагаемые последствия. Проверить эту рамку по первоисточникам.",categories:["badfaith","abuse","fault","reason"],archived:!1,demo:!0},{id:"r2",title:"Автономия воли и пределы свободы",question:"Как сформировать источниковую базу для исследования пределов частной автономии?",hypothesis:"Сначала собрать проверенные материалы, затем отделить положения источников от собственной интерпретации.",categories:["will","goodfaith"],archived:!1,demo:!0}],Hy=[{id:"n1",title:"Развести основания оценки",body:"В отдельной заметке сопоставить функцию каждого понятия. Совпадение итоговой оценки еще не объясняет различий в ее основаниях.",kind:"thought",sourceId:"boundaries",sectionId:"s1",quote:Zi[0].sections[0].paragraphs[1].text.slice(0,132),anchors:[{paragraphId:"p2",start:0,end:132}],categories:["badfaith","fault"],researchId:"r1",createdAt:"2026-10-16T06:20:00Z",demo:!0},{id:"n2",title:"Карта хранит направление поиска",body:"Не придавать линии на карте значение доказанной правовой связи. Уточнять ее содержание после проверки источников.",kind:"question",sourceId:"boundaries",sectionId:"s3",quote:Zi[0].sections[2].paragraphs[1].text.split(". ")[0]+".",anchors:[{paragraphId:"p10",start:0,end:(Zi[0].sections[2].paragraphs[1].text.split(". ")[0]+".").length}],categories:["goodfaith","badfaith"],researchId:"r1",createdAt:"2026-10-15T13:00:00Z",demo:!0}],du=f=>{var v;return((v=kl.find(U=>U.id===f))==null?void 0:v.title)??f},pm="antonovium.workspace.v1";function Hf(){var v;if((v=globalThis.crypto)!=null&&v.randomUUID)return g
