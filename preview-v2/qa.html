<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANTONOVIUM · Проверка размеров</title><style>
*{box-sizing:border-box}body{margin:0;background:#e7e9ef;font:14px system-ui;color:#172033}header{position:sticky;top:0;z-index:2;background:#172033;color:white;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}button{padding:9px 12px;background:#2b3e74;color:white;border:1px solid #7083b0;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#f47964;color:#172033}main{padding:22px;overflow:auto}iframe{display:block;width:1440px;height:900px;border:1px solid #999;background:white;box-shadow:0 8px 30px #0002;margin:auto}output{min-width:110px}
</style><header><strong>ANTONOVIUM / проверка адаптивности</strong><div id="sizes"></div><output id="value">1440 × 900</output></header><main><iframe title="ANTONOVIUM 2.0" src="./"></iframe></main><script>
const sizes=[1920,1440,1024,768,390,360],host=document.querySelector('#sizes'),frame=document.querySelector('iframe'),out=document.querySelector('#value');
for(const width of sizes){const b=document.createElement('button');b.textContent=width+' px';b.dataset.width=width;b.setAttribute('aria-pressed',String(width===1440));b.addEventListener('click',()=>{for(const x of host.children)x.setAttribute('aria-pressed',String(x===b));frame.style.width=width+'px';frame.style.height=(width<500?780:width<800?900:960)+'px';out.textContent=width+' × '+frame.style.height.replace('px','');});host.append(b)}
</script></html>
